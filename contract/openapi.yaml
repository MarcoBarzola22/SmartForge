openapi: 3.1.0
info:
  title: SmartForge API
  version: 1.0.0
  description: >
    API REST para SmartForge MVP - Entrenador personal digital con generación
    inteligente de mesociclos auto-periodizados, auditoría de fatiga y dolor articular,
    y sobrecarga progresiva basada en evidencia.
  contact:
    name: SmartForge Team
  license:
    name: Proprietary
    identifier: UNLICENSED
servers:
  - url: http://localhost:4000/api
    description: Servidor de desarrollo local
tags:
  - name: Auth
    description: Autenticación OAuth con Google y verificación JWT
  - name: Profile
    description: Gestión del perfil del atleta y equipamiento disponible
  - name: Exercises
    description: Catálogo de ejercicios, alternativas y videos demostrativos
  - name: Mesocycles
    description: Generación, consulta y rotación de mesociclos
  - name: Routines
    description: Edición de rutinas y sustitución de ejercicios
  - name: Sessions
    description: Check-in pre-entreno, registro de series y reporte de molestias
  - name: Progression
    description: Cálculo de sobrecarga progresiva y ajustes por fatiga
  - name: Sync
    description: Sincronización offline de datos

paths:
  /health:
    get:
      summary: Healthcheck del sistema
      description: Retorna el estado operativo de la API.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - timestamp
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /auth/google:
    get:
      tags:
        - Auth
      summary: Iniciar flujo de autenticación OAuth con Google
      description: Redirige al consent screen de Google OAuth 2.0.
      operationId: startGoogleAuth
      security: []
      responses:
        '302':
          description: Redirección al proveedor de identidad de Google.

  /auth/google/callback:
    get:
      tags:
        - Auth
      summary: Callback de Google OAuth
      description: Procesa el código o token de Google, emite un JWT stateless y verifica si requiere onboarding de perfil.
      operationId: googleAuthCallback
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Código de autorización de Google OAuth
      responses:
        '200':
          description: Autenticación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Token o código de Google inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags:
        - Auth
      summary: Obtener perfil del atleta autenticado
      description: Retorna los datos del atleta asociado al JWT Bearer token actual.
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perfil del atleta autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteProfile'
        '401':
          description: No autorizado (token ausente, inválido o expirado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /profile:
    post:
      tags:
        - Profile
      summary: Crear perfil de atleta (onboarding)
      description: Registra el perfil inicial del atleta tras autenticarse por primera vez. Todos los campos son obligatorios.
      operationId: createProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '201':
          description: Perfil creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteProfile'
        '400':
          description: Error de validación en los datos (ej. edad menor a 16 años).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: Conflicto - el atleta ya tiene un perfil creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Profile
      summary: Actualizar perfil de atleta
      description: Actualiza preferencias de entrenamiento o equipamiento del atleta autenticado.
      operationId: updateProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteProfile'
        '400':
          description: Error de validación en los datos a actualizar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Profile
      summary: Eliminar cuenta de atleta (soft-delete)
      description: Marca la cuenta del atleta como eliminada conservando historial disociado.
      operationId: deleteProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cuenta eliminada exitosamente.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Cuenta eliminada correctamente.
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /exercises:
    get:
      tags:
        - Exercises
      summary: Listar ejercicios del catálogo con filtros
      description: Retorna los ejercicios disponibles filtrados por patrón de movimiento, músculo primario, equipamiento o búsqueda por texto.
      operationId: listExercises
      security:
        - BearerAuth: []
      parameters:
        - name: pattern
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MovementPattern'
          description: Filtrar por patrón de movimiento
        - name: primary_muscle
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MuscleGroup'
          description: Filtrar por grupo muscular principal
        - name: equipment_id
          in: query
          required: false
          schema:
            type: string
          description: Filtrar por equipamiento requerido
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Búsqueda por nombre de ejercicio
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Lista de ejercicios obtenida exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exercise'
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /exercises/{id}:
    get:
      tags:
        - Exercises
      summary: Obtener detalle de un ejercicio
      description: Retorna los metadatos completos de un ejercicio, instrucciones y URLs de video demostrativo.
      operationId: getExerciseById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identificador único del ejercicio
      responses:
        '200':
          description: Detalle del ejercicio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ejercicio no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /exercises/{id}/alternatives:
    get:
      tags:
        - Exercises
      summary: Obtener alternativas compatibles para un ejercicio
      description: Retorna variantes biomecánicamente equivalentes (mismo patrón y músculo primario) filtradas por equipamiento del atleta.
      operationId: getExerciseAlternatives
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identificador del ejercicio a sustituir
        - name: equipment_id
          in: query
          required: false
          schema:
            type: string
          description: Filtrar alternativas por equipamiento específico
      responses:
        '200':
          description: Lista de ejercicios alternativos compatibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseAlternative'
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ejercicio no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /mesocycles:
    post:
      tags:
        - Mesocycles
      summary: Generar un nuevo mesociclo completo
      description: Genera y persiste un mesociclo auto-periodizado de 4 a 8 semanas con distribución de series, repeticiones y cargas estimadas.
      operationId: generateMesocycle
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateMesocycleRequest'
      responses:
        '201':
          description: Mesociclo generado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleDetail'
        '400':
          description: Error al generar mesociclo (ej. perfil incompleto o sin equipamiento compatible).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /mesocycles/current:
    get:
      tags:
        - Mesocycles
      summary: Obtener el mesociclo activo actual
      description: Retorna la estructura completa del mesociclo en curso con sus semanas, sesiones y ejercicios asignados.
      operationId: getCurrentMesocycle
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Mesociclo actual obtenido exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleDetail'
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe un mesociclo activo para el atleta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /mesocycles/{id}:
    get:
      tags:
        - Mesocycles
      summary: Obtener el detalle de un mesociclo por ID
      description: Retorna la información y planificación de un mesociclo específico (activo, completado o archivado).
      operationId: getMesocycleById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID del mesociclo
      responses:
        '200':
          description: Detalle del mesociclo obtenido exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleDetail'
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Mesociclo no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /assignments/{id}/swap:
    post:
      tags:
        - Routines
      summary: Reemplazar un ejercicio asignado en la rutina
      description: Sustituye un ejercicio en la sesión planificada por una alternativa compatible y registra el motivo del cambio.
      operationId: swapExerciseAssignment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la asignación de ejercicio a modificar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapExerciseRequest'
      responses:
        '200':
          description: Ejercicio sustituido exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseAssignment'
        '400':
          description: Alternativa incompatible o datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Asignación o nuevo ejercicio no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /assignments/{id}/progression:
    get:
      tags:
        - Progression
      summary: Obtener sugerencia de progresión de carga y repeticiones
      description: Calcula y retorna la próxima carga y repeticiones sugeridas para el ejercicio según el rendimiento previo y auditoría de fatiga.
      operationId: getProgressionSuggestion
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la asignación de ejercicio
      responses:
        '200':
          description: Sugerencia de progresión calculada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressionSuggestion'
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Asignación de ejercicio no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions:
    post:
      tags:
        - Sessions
      summary: Iniciar una sesión de entrenamiento
      description: Crea una sesión activa vinculada al plan de sesión correspondiente.
      operationId: createSession
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - session_plan_id
              properties:
                session_plan_id:
                  type: string
                  format: uuid
                  example: sp_101e4567-e89b-12d3-a456-426614174000
      responses:
        '201':
          description: Sesión iniciada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSession'
        '400':
          description: Error al iniciar sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions/{id}/checkin:
    post:
      tags:
        - Sessions
      summary: Enviar check-in pre-sesión de fatiga y dolor articular
      description: Registra el nivel de fatiga general (1–5) y las articulaciones con molestia (lado e intensidad). Obligatorio antes de registrar series.
      operationId: submitCheckIn
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la sesión de entrenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      responses:
        '201':
          description: Check-in registrado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
        '400':
          description: Datos de fatiga o articulación inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El check-in ya fue completado previamente para esta sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions/{id}/sets:
    post:
      tags:
        - Sessions
      summary: Registrar una serie realizada
      description: Guarda los datos de peso, repeticiones completadas y RIR (0–5) de una serie de entrenamiento.
      operationId: logSet
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la sesión de entrenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSetLogRequest'
      responses:
        '201':
          description: Serie registrada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetLog'
        '400':
          description: Datos de la serie inválidos (ej. RIR fuera de rango 0–5 o peso negativo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sets/{id}:
    put:
      tags:
        - Sessions
      summary: Editar una serie registrada
      description: Permite corregir peso, repeticiones o RIR de una serie dentro de la sesión activa.
      operationId: updateSetLog
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID del registro de serie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSetLogRequest'
      responses:
        '200':
          description: Serie actualizada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetLog'
        '400':
          description: Datos de la serie inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Serie no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Sessions
      summary: Eliminar una serie registrada
      description: Elimina una serie errónea de la sesión activa.
      operationId: deleteSetLog
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID del registro de serie
      responses:
        '204':
          description: Serie eliminada exitosamente.
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Serie no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions/{id}/pain-reports:
    post:
      tags:
        - Sessions
      summary: Reportar molestia articular post-ejercicio
      description: Registra reporte opcional de dolor tras ejecutar un ejercicio específico durante la sesión.
      operationId: reportExercisePain
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePainReportRequest'
      responses:
        '201':
          description: Reporte de molestia registrado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PainReport'
        '400':
          description: Datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions/{id}/complete:
    patch:
      tags:
        - Sessions
      summary: Marcar sesión de entrenamiento como completada
      description: Finaliza la sesión activa y gatilla la actualización de rachas y cálculos de sobrecarga.
      operationId: completeSession
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la sesión
      responses:
        '200':
          description: Sesión finalizada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSession'
        '400':
          description: La sesión no puede completarse (ej. ya finalizada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sync:
    post:
      tags:
        - Sync
      summary: Sincronizar por lotes datos registrados offline
      description: Procesa y persiste un lote mixto de check-ins, series y reportes de dolor registrados en modo offline.
      operationId: syncOfflineData
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: Sincronización procesada completamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '207':
          description: Sincronización procesada con advertencias o conflictos resueltos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '400':
          description: Formato de lote inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: No autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT generado tras la autenticación con Google OAuth.

  schemas:
    ExperienceLevel:
      type: string
      enum:
        - principiante
        - intermedio
        - avanzado
      description: Nivel de experiencia del atleta.

    TrainingGoal:
      type: string
      enum:
        - hipertrofia
        - fuerza
        - mixto
      description: Objetivo principal de entrenamiento del atleta.

    PeriodizationType:
      type: string
      enum:
        - lineal
        - ondulante
      description: Tipo de periodización aplicada al mesociclo.

    MesocycleStatus:
      type: string
      enum:
        - active
        - completed
        - archived
      description: Estado actual del mesociclo.

    SwapReason:
      type: string
      enum:
        - falta_equipamiento
        - preferencia_personal
        - molestia_articular
      description: Motivo por el cual el atleta solicita sustituir un ejercicio.

    SessionStatus:
      type: string
      enum:
        - in_progress
        - completed
        - cancelled
      description: Estado de la sesión de entrenamiento.

    Joint:
      type: string
      enum:
        - hombro
        - codo
        - muneca
